name: Publish reviewed Mi Casa bundle to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'estable/**'
      - 'pruebas/**'
      - 'storybook/**'
      - 'index.html'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for reviewed distribution
        shell: bash
        run: |
          if [ ! -f pruebas/index.html ] && [ ! -f storybook/index.html ] && [ ! -f estable/index.html ]; then
            echo "No reviewed distribution has been published yet."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
